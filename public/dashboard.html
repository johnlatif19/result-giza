<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم نتائج الطلاب - نظام الجلب التلقائي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --text-dark: #e2e8f0;
            --border-dark: #334155;
        }

        body.dark-mode {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        body.dark-mode .card {
            background-color: var(--card-dark);
            border-color: var(--border-dark);
            color: var(--text-dark);
        }

        body.dark-mode .table {
            color: var(--text-dark);
        }

        body.dark-mode .table-striped > tbody > tr:nth-of-type(odd) > * {
            background-color: rgba(255, 255, 255, 0.05);
        }

        body.dark-mode pre {
            background-color: #0f172a;
            color: #86efac;
            border: 1px solid #334155;
        }

        .card-latest {
            border-right: 5px solid #0d6efd;
        }

        pre {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 300px;
        }

        .badge-success {
            background-color: #198754;
        }

        .badge-error {
            background-color: #dc3545;
        }

        .refresh-icon {
            cursor: pointer;
            transition: transform 0.3s;
        }

        .refresh-icon:hover {
            transform: rotate(180deg);
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 5px 10px;
        }

        .timestamp {
            font-family: monospace;
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="dark-mode">
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="display-6">
                    <i class="bi bi-bar-chart-steps"></i> لوحة تحكم النتائج
                </h1>
                <p class="text-muted">جلب تلقائي من نظام جيزا نت كل دقيقة</p>
            </div>
            <div class="d-flex gap-3 align-items-center">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="darkModeToggle" checked>
                    <label class="form-check-label" for="darkModeToggle">
                        <i class="bi bi-moon-stars"></i> الوضع الداكن
                    </label>
                </div>
                <i class="bi bi-arrow-repeat refresh-icon fs-4" id="manualRefresh" title="تحديث يدوي"></i>
                <span id="autoRefreshStatus" class="badge bg-success">تحديث تلقائي كل 10 ثوانٍ</span>
            </div>
        </div>

        <!-- Latest Response Card -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card card-latest shadow-sm">
                    <div class="card-header bg-transparent">
                        <h5 class="mb-0">
                            <i class="bi bi-star-fill text-warning"></i> آخر استجابة من الـ API
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="latestContent">
                            <div class="text-center text-muted">
                                <div class="spinner-border" role="status"></div>
                                <p>جاري تحميل البيانات...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- History Table -->
        <div class="card shadow-sm">
            <div class="card-header bg-transparent">
                <h5 class="mb-0">
                    <i class="bi bi-clock-history"></i> سجل الفحوصات
                </h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th><i class="bi bi-clock"></i> وقت الفحص</th>
                                <th><i class="bi bi-code-square"></i> Status Code</th>
                                <th><i class="bi bi-database"></i> البيانات / الخطأ</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <tr>
                                <td colspan="4" class="text-center text-muted">جاري التحميل...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let autoRefreshInterval = null;

        // Format JSON for display
        function formatData(data, isError = false) {
            if (!data) return '<span class="text-muted">لا توجد بيانات</span>';
            if (typeof data === 'string') return `<pre>${escapeHtml(data)}</pre>`;
            return `<pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = typeof text === 'string' ? text : JSON.stringify(text, null, 2);
            return div.innerHTML;
        }

        // Update Latest Card
        function updateLatest(data) {
            const container = document.getElementById('latestContent');
            if (!data || !data.timestamp) {
                container.innerHTML = '<div class="alert alert-warning">لا توجد بيانات حتى الآن</div>';
                return;
            }

            const statusClass = data.statusCode >= 200 && data.statusCode < 300 ? 'success' : 'danger';
            const badgeClass = data.success !== false ? 'bg-success' : 'bg-danger';
            const statusText = data.success !== false ? 'نجاح' : 'فشل';

            container.innerHTML = `
                <div class="row">
                    <div class="col-md-3 mb-2">
                        <strong><i class="bi bi-calendar-event"></i> وقت الفحص:</strong><br>
                        <span class="timestamp">${new Date(data.timestamp).toLocaleString('ar-EG')}</span>
                    </div>
                    <div class="col-md-2 mb-2">
                        <strong><i class="bi bi-code-square"></i> Status Code:</strong><br>
                        <span class="badge bg-${statusClass} status-badge">${data.statusCode}</span>
                    </div>
                    <div class="col-md-2 mb-2">
                        <strong><i class="bi bi-check-circle"></i> الحالة:</strong><br>
                        <span class="badge ${badgeClass} status-badge">${statusText}</span>
                    </div>
                    <div class="col-12 mt-3">
                        <strong><i class="bi bi-database"></i> محتوى الاستجابة:</strong>
                        ${data.error ? `<div class="alert alert-danger mt-2">⚠️ خطأ: ${escapeHtml(data.error)}</div>` : formatData(data.data)}
                    </div>
                </div>
            `;
        }

        // Update History Table
        function updateHistory(historyData) {
            const tbody = document.getElementById('historyTableBody');
            if (!historyData || historyData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">لا يوجد سجل بعد</td></tr>';
                return;
            }

            tbody.innerHTML = historyData.map((item, index) => {
                const statusClass = item.statusCode >= 200 && item.statusCode < 300 ? 'success' : 'danger';
                const displayData = item.error ? `⚠️ خطأ: ${item.error.substring(0, 100)}` : 
                                   (typeof item.data === 'object' ? JSON.stringify(item.data).substring(0, 150) : String(item.data || '').substring(0, 150));
                
                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td class="timestamp">${new Date(item.timestamp).toLocaleString('ar-EG')}</td>
                        <td><span class="badge bg-${statusClass}">${item.statusCode}</span></td>
                        <td>
                            <pre style="margin:0; font-size:11px; max-height:100px; overflow:auto;">${escapeHtml(displayData)}${displayData.length >= 150 ? '...' : ''}</pre>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Fetch all data
        async function fetchAllData() {
            try {
                const [latestRes, historyRes] = await Promise.all([
                    fetch('/api/latest'),
                    fetch('/api/history')
                ]);

                if (latestRes.ok) {
                    const latest = await latestRes.json();
                    updateLatest(latest);
                }

                if (historyRes.ok) {
                    const history = await historyRes.json();
                    updateHistory(history);
                }

                // Update timestamp
                const now = new Date();
                document.title = `Dashboard - ${now.toLocaleTimeString('ar-EG')}`;
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('latestContent').innerHTML = 
                    '<div class="alert alert-danger">⚠️ فشل الاتصال بالخادم</div>';
            }
        }

        // Dark mode toggle
        function initDarkMode() {
            const toggle = document.getElementById('darkModeToggle');
            const body = document.body;
            
            if (localStorage.getItem('darkMode') === 'false') {
                body.classList.remove('dark-mode');
                toggle.checked = false;
            } else {
                body.classList.add('dark-mode');
                toggle.checked = true;
            }

            toggle.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark-mode');
                    localStorage.setItem('darkMode', 'true');
                } else {
                    body.classList.remove('dark-mode');
                    localStorage.setItem('darkMode', 'false');
                }
            });
        }

        // Auto refresh
        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(fetchAllData, 10000);
        }

        // Manual refresh
        document.getElementById('manualRefresh').addEventListener('click', () => {
            fetchAllData();
            const icon = document.getElementById('manualRefresh');
            icon.style.transform = 'rotate(180deg)';
            setTimeout(() => { icon.style.transform = ''; }, 300);
        });

        // Initialize
        initDarkMode();
        startAutoRefresh();
        fetchAllData();
    </script>
</body>
</html>
